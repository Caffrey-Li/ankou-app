[package]
name = "wanxiang-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "万象小助手"

[lib]
name = "wanxiang_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
wanxiang-core = { path = "../crates/core" }
window-vibrancy = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSVisualEffectView", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation"] }
raw-window-handle = "0.6"
