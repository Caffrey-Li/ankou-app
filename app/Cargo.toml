[package]
name = "wanxiang-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "万象小助手"

[lib]
name = "wanxiang_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
wanxiang-adapter-codex = { path = "../crates/adapters/codex" }
wanxiang-adapter-cursor = { path = "../crates/adapters/cursor" }
wanxiang-adapter-dsh = { path = "../crates/adapters/dsh" }
wanxiang-core = { path = "../crates/core" }
window-vibrancy = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSVisualEffectView", "objc2-quartz-core", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSBundle", "NSString", "NSDictionary", "NSData", "NSArray", "NSFileManager", "NSError", "NSURL"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation"] }
raw-window-handle = "0.6"
