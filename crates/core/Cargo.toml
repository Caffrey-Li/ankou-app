[package]
name = "wanxiang-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
getrandom = "0.4"
keyring = { version = "4.2.0", features = ["v1"] }
keyring-core = "1.0.1"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"] }

[dev-dependencies]
chrono = "0.4.45"
proptest = "1"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
